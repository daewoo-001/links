<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영상 속 제품</title>
<meta name="description" content="쇼츠에 나온 제품 구매 링크 모음">
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #f6f5f2;
    --card: #ffffff;
    --text: #1b1b1f;
    --muted: #6b6b73;
    --line: #e4e2dc;
    --accent: #1b1b1f;
    --accent-text: #ffffff;
    --notice-bg: #fff6d6;
    --notice-text: #5c4a00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121214;
      --card: #1c1c20;
      --text: #f2f2f4;
      --muted: #a0a0a8;
      --line: #2c2c32;
      --accent: #ffd400;
      --accent-text: #121214;
      --notice-bg: #2a2410;
      --notice-text: #f3dd8a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 480px; margin: 0 auto; padding: 28px 16px 48px; }
  header { text-align: center; margin-bottom: 20px; }
  header h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.02em; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  .notice {
    background: var(--notice-bg);
    color: var(--notice-text);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 13px;
    margin-bottom: 20px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 18px;
    display: grid;
    grid-template-columns: 96px 1fr;
    gap: 14px;
    align-items: center;
    margin-bottom: 14px;
  }
  .thumb {
    display: block;
    width: 96px; height: 96px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: #ffffff;
    object-fit: cover;
  }
  .hook { font-size: 13px; color: var(--muted); margin: 0 0 4px; }
  .name { font-size: 17px; font-weight: 700; margin: 0; letter-spacing: -0.01em; word-break: keep-all; }
  .btn {
    display: block;
    grid-column: 1 / -1;
    text-align: center;
    background: var(--accent);
    color: var(--accent-text);
    text-decoration: none;
    font-weight: 700;
    font-size: 16px;
    padding: 14px;
    border-radius: 12px;
  }
  .btn:active { transform: scale(.99); }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 28px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>영상 속 제품</h1>
    <p>쇼츠에 나온 제품을 모아 두었어요</p>
  </header>

  <p class="notice">이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</p>

  <section id="list">
    <!-- 제품 추가: 사진을 img/ 에 넣고 아래 PRODUCTS 배열에 한 줄씩 넣으면 카드가 생깁니다 (최신 영상을 맨 위에) -->
    <noscript>
      <div class="card">
        <img class="thumb" src="img/balmuda_toaster.jpg" alt="발뮤다 더 토스터" width="96" height="96">
        <div><p class="hook">물을 붓는 토스터를 알면 사게 되는 이유</p><p class="name">발뮤다 더 토스터</p></div>
        <a class="btn" href="https://link.coupang.com/a/htdJbHBxYW" rel="sponsored nofollow noopener" target="_blank">쿠팡에서 보기</a>
      </div>
      <div class="card">
        <img class="thumb" src="img/shokz_openrun_pro2.jpg" alt="샥즈 오픈런 프로 2 S820 골전도 이어폰" width="96" height="96">
        <div><p class="hook">귀를 안 막는 이어폰을 일부러 이렇게 만든 이유</p><p class="name">샥즈 오픈런 프로 2 S820 골전도 이어폰</p></div>
        <a class="btn" href="https://link.coupang.com/a/hskM5vITJY" rel="sponsored nofollow noopener" target="_blank">쿠팡에서 보기</a>
      </div>
      <div class="card">
        <img class="thumb" src="img/tefal_ingenio.jpg" alt="테팔 매직핸즈 인덕션 볶음팬 멀티 6종 세트" width="96" height="96">
        <div><p class="hook">후라이팬에 손잡이가 없는 진짜 이유</p><p class="name">테팔 매직핸즈 인덕션 볶음팬 멀티 6종 세트</p></div>
        <a class="btn" href="https://link.coupang.com/a/hpJ2vxb3U4" rel="sponsored nofollow noopener" target="_blank">쿠팡에서 보기</a>
      </div>
      <div class="card">
        <img class="thumb" src="img/thexlab_mini.jpg" alt="더비랩 핸드폰 감옥 타이머 락박스" width="96" height="96">
        <div><p class="hook">안 열리는 통이 요즘 대박 난 이유</p><p class="name">더비랩 핸드폰 감옥 타이머 락박스</p></div>
        <a class="btn" href="https://link.coupang.com/a/hnWBfeZLWe" rel="sponsored nofollow noopener" target="_blank">쿠팡에서 보기</a>
      </div>
      <div class="card">
        <img class="thumb" src="img/philips_hf3520.jpg" alt="필립스 웨이크업 라이트 HF3520" width="96" height="96">
        <div><p class="hook">안 시끄러운 알람시계가 업계 1황인 이유</p><p class="name">필립스 웨이크업 라이트 HF3520</p></div>
        <a class="btn" href="https://link.coupang.com/a/hiSdwoyAE0" rel="sponsored nofollow noopener" target="_blank">쿠팡에서 보기</a>
      </div>
    </noscript>
  </section>

  <footer>링크를 누르면 쿠팡 상품 페이지로 이동합니다.</footer>
</main>
<script>
  const PRODUCTS = [
    {
      hook: "물을 붓는 토스터를 알면 사게 되는 이유",
      name: "발뮤다 더 토스터",
      image: "img/balmuda_toaster.jpg",
      url: "https://link.coupang.com/a/htdJbHBxYW",
      button: "쿠팡에서 보기"
    },
    {
      hook: "귀를 안 막는 이어폰을 일부러 이렇게 만든 이유",
      name: "샥즈 오픈런 프로 2 S820 골전도 이어폰",
      image: "img/shokz_openrun_pro2.jpg",
      url: "https://link.coupang.com/a/hskM5vITJY",
      button: "쿠팡에서 보기"
    },
    {
      hook: "후라이팬에 손잡이가 없는 진짜 이유",
      name: "테팔 매직핸즈 인덕션 볶음팬 멀티 6종 세트",
      image: "img/tefal_ingenio.jpg",
      url: "https://link.coupang.com/a/hpJ2vxb3U4",
      button: "쿠팡에서 보기"
    },
    {
      hook: "안 열리는 통이 요즘 대박 난 이유",
      name: "더비랩 핸드폰 감옥 타이머 락박스",
      image: "img/thexlab_mini.jpg",
      url: "https://link.coupang.com/a/hnWBfeZLWe",
      button: "쿠팡에서 보기"
    },
    {
      hook: "안 시끄러운 알람시계가 업계 1황인 이유",
      name: "필립스 웨이크업 라이트 HF3520",
      image: "img/philips_hf3520.jpg",
      url: "https://link.coupang.com/a/hiSdwoyAE0",
      button: "쿠팡에서 보기"
    }
  ];

  const list = document.getElementById("list");
  for (const p of PRODUCTS) {
    const card = document.createElement("article");
    card.className = "card";
    card.innerHTML =
      '<img class="thumb" width="96" height="96" loading="lazy">' +
      '<div><p class="hook"></p><p class="name"></p></div>' +
      '<a class="btn" rel="sponsored nofollow noopener" target="_blank"></a>';
    const img = card.querySelector(".thumb");
    img.src = p.image;
    img.alt = p.name;
    card.querySelector(".hook").textContent = p.hook;
    card.querySelector(".name").textContent = p.name;
    const a = card.querySelector(".btn");
    a.href = p.url;
    a.textContent = p.button || "쿠팡에서 보기";
    list.appendChild(card);
  }
</script>
</body>
</html>
